apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-galera
  annotations:
    container.apparmor.security.beta.kubernetes.io/mariadb: unconfined
spec:
  image: mariadb:11.4
  rootPasswordSecretKeyRef:
    name: mariadb-root
    key: password
  replicas: 3
  galera:
    enabled: true
  podSecurityContext:
    appArmorProfile:
      type: Unconfined
  storage:
    ephemeral: false
    size: 5Gi
    storageClassName: local-path
    volumeClaimTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: local-path
  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=row
    innodb_autoinc_lock_mode=2
    innodb_buffer_pool_size=256M
    max_connections=100
    innodb_use_native_aio=0
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
